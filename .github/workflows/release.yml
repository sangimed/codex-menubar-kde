name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build and release dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            cmake \
            extra-cmake-modules \
            git \
            github-cli \
            libplasma \
            ninja \
            python \
            qt6-base \
            qt6-declarative \
            zstd

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Trust checkout inside the Arch container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION="$(sed -nE 's/^project\(codex-menubar-kde VERSION ([0-9.]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)"
          METADATA_VERSION="$(python -c 'import json; print(json.load(open("package/metadata.json"))["KPlugin"]["Version"])')"
          PKGBUILD_VERSION="$(sed -nE 's/^pkgver=([0-9.]+)$/\1/p' packaging/aur/PKGBUILD)"

          test -n "$CMAKE_VERSION"
          test "$VERSION" = "$CMAKE_VERSION"
          test "$VERSION" = "$METADATA_VERSION"
          test "$VERSION" = "$PKGBUILD_VERSION"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage installation
        run: |
          rm -rf stage
          DESTDIR="$GITHUB_WORKSPACE/stage" cmake --install build

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="codex-menubar-kde-${VERSION}-arch-x86_64.tar.zst"
          tar --zstd -C stage -cf "$ARCHIVE" usr
          sha256sum "$ARCHIVE" > SHA256SUMS
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" \
            SHA256SUMS \
            --title "Codex MenuBar KDE ${GITHUB_REF_NAME#v}" \
            --generate-notes
