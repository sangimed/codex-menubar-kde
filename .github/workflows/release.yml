name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build and release dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            cmake \
            extra-cmake-modules \
            git \
            github-cli \
            libplasma \
            ninja \
            python \
            qt6-base \
            qt6-declarative \
            zstd

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Trust checkout inside the Arch container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION="$(sed -nE 's/^project\(codex-menubar-kde VERSION ([0-9.]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)"
          METADATA_VERSION="$(python -c 'import json; print(json.load(open("package/metadata.json"))["KPlugin"]["Version"])')"
          PKGBUILD_VERSION="$(sed -nE 's/^pkgver=([0-9.]+)$/\1/p' packaging/aur/PKGBUILD)"
          SRCINFO_VERSION="$(sed -nE 's/^\s*pkgver = ([0-9.]+)$/\1/p' packaging/aur/.SRCINFO | head -n1)"

          test -n "$CMAKE_VERSION"
          test "$VERSION" = "$CMAKE_VERSION"
          test "$VERSION" = "$METADATA_VERSION"
          test "$VERSION" = "$PKGBUILD_VERSION"
          test "$VERSION" = "$SRCINFO_VERSION"
          bash -n packaging/aur/PKGBUILD

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage installation
        run: |
          rm -rf stage
          DESTDIR="$GITHUB_WORKSPACE/stage" cmake --install build
          test -f stage/usr/share/licenses/codex-menubar-kde/LICENSE
          test -f stage/usr/share/plasma/plasmoids/io.github.sangimed.codexmenubarkde/metadata.json
          test -f stage/usr/lib/qt6/qml/io/github/sangimed/codexmenubarkde/libcodexmenubarkdeplugin.so

      - name: Build native Arch package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          useradd --create-home builder
          install -d -o builder -g builder /tmp/codex-menubar-kde-package
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO /tmp/codex-menubar-kde-package/
          chown -R builder:builder /tmp/codex-menubar-kde-package

          runuser -u builder -- bash -lc '
            cd /tmp/codex-menubar-kde-package
            makepkg --cleanbuild --noconfirm
          '

          PACKAGE="/tmp/codex-menubar-kde-package/codex-menubar-kde-${VERSION}-1-x86_64.pkg.tar.zst"
          test -f "$PACKAGE"

          PACKAGE_NAME="$(basename "$PACKAGE")"
          cp "$PACKAGE" "$GITHUB_WORKSPACE/$PACKAGE_NAME"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$PACKAGE_NAME" > SHA256SUMS
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PACKAGE_NAME" \
            SHA256SUMS \
            --title "Codex MenuBar KDE ${GITHUB_REF_NAME#v}" \
            --generate-notes
