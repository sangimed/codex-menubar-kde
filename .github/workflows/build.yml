name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            cmake \
            extra-cmake-modules \
            git \
            libplasma \
            ninja \
            python \
            qt6-base \
            qt6-declarative

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Trust checkout inside the Arch container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify version metadata
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_VERSION="$(sed -nE 's/^project\(codex-menubar-kde VERSION ([0-9.]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)"
          METADATA_VERSION="$(python -c 'import json; print(json.load(open("package/metadata.json"))["KPlugin"]["Version"])')"
          PKGBUILD_VERSION="$(sed -nE 's/^pkgver=([0-9.]+)$/\1/p' packaging/aur/PKGBUILD)"

          test -n "$CMAKE_VERSION"
          test "$CMAKE_VERSION" = "$METADATA_VERSION"
          test "$CMAKE_VERSION" = "$PKGBUILD_VERSION"
          bash -n packaging/aur/PKGBUILD

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install smoke test
        run: |
          rm -rf stage
          DESTDIR="$GITHUB_WORKSPACE/stage" cmake --install build
          test -f stage/usr/share/plasma/plasmoids/io.github.sangimed.codexmenubarkde/metadata.json
          test -f stage/usr/share/plasma/plasmoids/io.github.sangimed.codexmenubarkde/contents/images/codex-menubar-kde.svg
          test -f stage/usr/share/plasma/plasmoids/io.github.sangimed.codexmenubarkde/contents/ui/AdditionalLimitsSection.qml
          test -f stage/usr/share/plasma/plasmoids/io.github.sangimed.codexmenubarkde/contents/ui/UsageHistorySection.qml
          test -f stage/usr/share/icons/hicolor/scalable/apps/codex-menubar-kde.svg
          test -f stage/usr/lib/qt6/qml/io/github/sangimed/codexmenubarkde/libcodexmenubarkdeplugin.so
          test -f stage/usr/lib/qt6/qml/io/github/sangimed/codexmenubarkde/qmldir

      - name: QML lint
        shell: bash
        run: |
          set -euo pipefail

          QMLLINT="$(command -v qmllint || true)"
          if [[ -z "$QMLLINT" && -x /usr/lib/qt6/bin/qmllint ]]; then
            QMLLINT=/usr/lib/qt6/bin/qmllint
          fi

          test -n "$QMLLINT"
          test -x "$QMLLINT"

          "$QMLLINT" \
            -I "$GITHUB_WORKSPACE/stage/usr/lib/qt6/qml" \
            package/contents/ui/*.qml
